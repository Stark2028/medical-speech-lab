name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'numpy>=1.26,<3' 'jiwer>=3,<5'
      - name: Compile Python
        run: python -m compileall -q medspeech tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
