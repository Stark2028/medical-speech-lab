name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'jiwer>=3,<5' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'scipy>=1.13,<2' 'soundfile>=0.12,<1'
      - name: Compile Python
        run: python -m compileall -q medspeech tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
